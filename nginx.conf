server {
    listen 80;
    server_name alpina216.com www.alpina216.com;
    root /var/www/public_html;
    index index.php index.html index.htm;

    # Log files
    access_log /var/log/nginx/alpina216.access.log;
    error_log /var/log/nginx/alpina216.error.log;

    # Max upload size
    client_max_body_size 64M;

    # Handle PHP files
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock; # Adjust PHP version if needed
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Clean URLs / .htaccess equivalent
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static assets caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot|otf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Deny access to sensitive files
    location ~ /\.(ht|git|env) {
        deny all;
    }
}
